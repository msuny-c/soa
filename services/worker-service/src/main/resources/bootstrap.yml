spring:
  application:
    name: worker-service
  cloud:
    config:
      uri: http://config-server:8888
      fail-fast: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
    # Speed up registration so the gateway sees new instances quickly in the local compose setup.
    instance-info-replication-interval-seconds: 5
