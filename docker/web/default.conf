# TLS entry point: serves the SPA static assets and proxies API calls to the Zuul gateway.
# Listens on the same port compose publishes to the host, so the forwarded port below
# always matches the external contract (https://localhost:24081/api/v1, as in labs 1-2).
server {
    listen 24081 ssl;
    ssl_certificate     /etc/nginx/certs/worker.pem;
    ssl_certificate_key /etc/nginx/certs/worker.pem;

    location /api/ {
        proxy_pass http://gateway:8080;
        # Rebuild absolute URLs downstream: keep host with port and force https scheme.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        # SPA uses HashRouter — plain static serving is enough; index fallback is belt and braces.
        try_files $uri /index.html;
    }
}
