# HAProxy load balancer in front of both Payara HR instances (lab 3 requirement).
global
    maxconn 2000

defaults
    mode http
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend hr_tls
    bind *:8443 ssl crt /usr/local/etc/haproxy/hr.pem
    default_backend hr_nodes

backend hr_nodes
    balance roundrobin
    # hr2 serves HTTPS on 21081 (its listener port was shifted from the default 8181).
    server hr1 hr1:8181 ssl verify none check
    server hr2 hr2:21081 ssl verify none check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
