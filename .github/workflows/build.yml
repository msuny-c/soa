name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 21 is the default JVM for Maven; 11 is registered in toolchains.xml for the
          # Spring Cloud (Boot 2.3) module tests via the -Pjdk11-tests profile.
          java-version: |
            21
            11
          cache: maven

      - name: Build and test
        env:
          VITE_WORKER_API: https://localhost:24081/api/v1
          VITE_HR_API: https://localhost:24181/hr
        run: mvn -B clean verify -Pjdk11-tests
