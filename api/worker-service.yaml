openapi: 3.0.3

info:
  title: Worker Collection Service
  description: Сервис управления коллекцией объектов Worker.
  version: 1.0.0

servers:
  - url: https://localhost:8443/api/v1

tags:
  - name: workers
  - name: workers-extra

paths:

  /workers:
    get:
      tags: [workers]
      summary: Получить массив элементов с сортировкой, фильтрацией и постраничным выводом
      parameters:
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/FilterParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Страница объектов коллекции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [workers]
      summary: Добавить новый элемент в коллекцию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Worker'
      responses:
        '201':
          description: Объект создан
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workers/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkerId'
    get:
      tags: [workers]
      summary: Получить элемент коллекции по ID
      responses:
        '200':
          description: Найденный объект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [workers]
      summary: Обновить элемент коллекции
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Worker'
      responses:
        '200':
          description: Объект обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [workers]
      summary: Удалить элемент коллекции по ID
      responses:
        '204':
          description: Объект удалён
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workers/salary/average:
    get:
      tags: [workers-extra]
      summary: Рассчитать среднее значение поля salary для всех объектов
      responses:
        '200':
          description: Среднее значение зарплаты
          content:
            application/json:
              schema:
                type: object
                required: [average, count]
                properties:
                  average:
                    type: number
                    format: double
                    nullable: true
                  count:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workers/salary/value/{salary}:
    delete:
      tags: [workers-extra]
      summary: Удалить один объект с заданным значением salary
      parameters:
        - name: salary
          in: path
          required: true
          schema:
            type: integer
            format: int64
            exclusiveMinimum: true
            minimum: 0
      responses:
        '200':
          description: Удалённый объект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /workers/search/name/{substring}:
    get:
      tags: [workers-extra]
      summary: Получить объекты, поле name которых содержит заданную подстроку
      parameters:
        - name: substring
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Найденные объекты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  parameters:

    WorkerId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1

    SortParam:
      name: sort
      in: query
      description: Поля сортировки через запятую, префикс `-` — убывание. Например `-salary,name`
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string

    FilterParam:
      name: filter
      in: query
      description: Условия вида `поле[операция]=значение`, объединяются по И. Операции - eq, ne, gt, gte, lt, lte, substr, null. Например `salary[gte]=1000`
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  schemas:

    Worker:
      type: object
      required: [name, coordinates, salary, start_date, position, person]
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          readOnly: true
        name:
          type: string
          minLength: 1
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        creation_date:
          type: string
          format: date-time
          readOnly: true
        salary:
          type: integer
          format: int64
          exclusiveMinimum: true
          minimum: 0
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        position:
          $ref: '#/components/schemas/Position'
        person:
          $ref: '#/components/schemas/Person'
      example:
        id: 1
        name: Ivan Petrov
        coordinates:
          x: 12
          y: -45.7
        creation_date: '2026-09-07T12:30:00Z'
        salary: 85000
        start_date: '2024-01-15'
        end_date: null
        position: DEVELOPER
        person:
          passport_id: AB1234567
          location:
            x: 10.5
            y: 20.25
            z: 300
            name: Saint Petersburg

    Coordinates:
      type: object
      required: [x, y]
      properties:
        x:
          type: integer
          format: int32
        y:
          type: number
          format: double

    Person:
      type: object
      properties:
        passport_id:
          type: string
          minLength: 7
          maxLength: 23
          nullable: true
        location:
          allOf:
            - $ref: '#/components/schemas/Location'
          nullable: true

    Location:
      type: object
      required: [x, y, z]
      properties:
        x:
          type: number
          format: float
        y:
          type: number
          format: double
        z:
          type: integer
          format: int64
        name:
          type: string
          minLength: 1
          nullable: true

    Position:
      type: string
      enum: [DEVELOPER, LEAD_DEVELOPER, BAKER]

    WorkerPage:
      type: object
      required: [items, page, size, total_elements, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Worker'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total_elements:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int32

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string

  responses:

    BadRequest:
      description: Некорректные параметры запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Нарушена уникальность passport_id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UnprocessableEntity:
      description: Нарушены ограничения целостности
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'