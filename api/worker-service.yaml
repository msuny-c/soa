openapi: 3.0.3

info:
  title: Worker Collection Service
  description: Сервис управления коллекцией объектов Worker.
  version: 1.0.0

servers:
  - url: https://localhost:8443/api/v1
    description: Базовый URL первого сервиса

tags:
  - name: workers
    description: Базовые CRUD-операции с коллекцией сотрудников
  - name: workers-extra
    description: Дополнительные операции (поиск, агрегация, удаление по условию)

paths:

  /workers:
    get:
      tags: [workers]
      summary: Получить массив элементов с сортировкой, фильтрацией и постраничным выводом
      description: |
        Возвращает список работников.
        Поддерживает сортировку по полям, фильтрацию по условиям и пагинацию.
      parameters:
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/FilterParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Страница объектов коллекции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerPage'
        '400':
          description: Некорректные параметры запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Некорректный параметр сортировки"
                details:
                  - field: "sort"
                    issue: "Неизвестное поле 'foo'. Допустимые поля: id, name, salary, startDate, endDate, position"
        '422':
          description: Недопустимое значение в фильтре
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Недопустимая операция в фильтре"
                details:
                  - field: "filter"
                    issue: "Операция 'xyz' не поддерживается. Допустимые: eq, ne, gt, gte, lt, lte, substr, null"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Внутренняя ошибка сервера при выполнении запроса"

    post:
      tags: [workers]
      summary: Добавить новый элемент в коллекцию
      description: |
        Создаёт новый объект Worker.
        Поля id и creationDate генерируются автоматически и не должны передаваться.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerWrite'
      responses:
        '201':
          description: Объект создан
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          description: Некорректный формат тела запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Некорректный формат тела запроса"
                details:
                  - field: "salary"
                    issue: "Ожидался числовой тип, получена строка"
        '409':
          description: Нарушена уникальность passportID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Работник с passportID 'AB1234567' уже существует"
        '422':
          description: Нарушены ограничения целостности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Нарушены ограничения полей"
                details:
                  - field: "salary"
                    issue: "Значение должно быть строго больше 0"
                  - field: "name"
                    issue: "Строка не может быть пустой"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Внутренняя ошибка сервера при создании объекта"

  /workers/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkerId'

    get:
      tags: [workers]
      summary: Получить элемент коллекции по ID
      description: Возвращает подробную информацию о работнике по его идентификатору.
      responses:
        '200':
          description: Найденный объект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          description: Некорректный формат идентификатора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Некорректный формат идентификатора"
                details:
                  - field: "id"
                    issue: "Значение должно быть целым числом >= 1, получено 'abc'"
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Работник с id=999 не найден"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Внутренняя ошибка сервера при получении объекта"

    put:
      tags: [workers]
      summary: Обновить элемент коллекции
      description: |
        Полностью заменяет данные работника.
        Поля id и creationDate не могут быть изменены.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerWrite'
      responses:
        '200':
          description: Объект обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          description: Некорректный формат тела запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Некорректный формат тела запроса"
                details:
                  - field: "coordinates"
                    issue: "Поле 'coordinates' обязательно и не может быть null"
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Работник с id=999 не найден"
        '409':
          description: Нарушена уникальность passportID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Работник с passportID 'XY9876543' уже существует"
        '422':
          description: Нарушены ограничения целостности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Нарушены ограничения полей"
                details:
                  - field: "position"
                    issue: "Недопустимое значение 'MANAGER'. Допустимые: DEVELOPER, LEAD_DEVELOPER, BAKER"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Внутренняя ошибка сервера при обновлении объекта"

    delete:
      tags: [workers]
      summary: Удалить элемент коллекции по ID
      description: Удаляет запись о работнике из коллекции.
      responses:
        '204':
          description: Объект удалён
        '400':
          description: Некорректный формат идентификатора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Некорректный формат идентификатора"
                details:
                  - field: "id"
                    issue: "Значение должно быть целым числом >= 1, получено '-5'"
        '404':
          description: Объект не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Работник с id=999 не найден"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Внутренняя ошибка сервера при удалении объекта"

  /workers/salary/average:
    get:
      tags: [workers-extra]
      summary: Рассчитать среднее значение поля salary для всех объектов
      description: |
        Вычисляет среднюю зарплату по всем работникам.
        Если коллекция пуста, average возвращается равным null.
      responses:
        '200':
          description: Среднее значение зарплаты
          content:
            application/json:
              schema:
                type: object
                required: [average, count]
                properties:
                  average:
                    type: number
                    format: double
                    nullable: true
                    description: Среднее арифметическое зарплат (null, если нет записей)
                  count:
                    type: integer
                    description: Количество учтённых записей
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Ошибка при вычислении средней зарплаты"

  /workers/salary/value/{salary}:
    delete:
      tags: [workers-extra]
      summary: Удалить один объект с заданным значением salary
      description: Удаляет один произвольный объект, значение salary которого равно переданному.
      parameters:
        - name: salary
          in: path
          required: true
          description: Значение зарплаты для удаления
          schema:
            type: integer
            format: int64
            exclusiveMinimum: true
            minimum: 0
      responses:
        '200':
          description: Удалённый объект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worker'
        '400':
          description: Некорректное значение salary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Некорректное значение salary"
                details:
                  - field: "salary"
                    issue: "Значение должно быть целым числом строго больше 0, получено '0'"
        '404':
          description: Объект с указанным salary не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Объект с salary=50000 не найден в коллекции"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Внутренняя ошибка сервера при удалении по salary"

  /workers/search/name/{substring}:
    get:
      tags: [workers-extra]
      summary: Получить объекты, поле name которых содержит заданную подстроку
      description: Осуществляет поиск работников по вхождению подстроки в поле name.
      parameters:
        - name: substring
          in: path
          required: true
          description: Подстрока для поиска в имени работника
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Найденные объекты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerPage'
        '400':
          description: Некорректные параметры поиска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Подстрока поиска не может быть пустой"
                details:
                  - field: "substring"
                    issue: "Минимальная длина строки — 1 символ"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: "Внутренняя ошибка сервера при поиске по имени"

components:

  parameters:

    WorkerId:
      name: id
      in: path
      required: true
      description: Идентификатор работника
      schema:
        type: integer
        format: int32
        minimum: 1

    SortParam:
      name: sort
      in: query
      description: Поля сортировки через запятую, префикс `-` — убывание. Например `-salary,name`
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string

    FilterParam:
      name: filter
      in: query
      description: Условия вида `поле[операция]=значение`, объединяются по И. Операции - eq, ne, gt, gte, lt, lte, substr, null. Например `salary[gte]=1000`
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string

    PageParam:
      name: page
      in: query
      description: Номер страницы (нумерация с 0)
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

    SizeParam:
      name: size
      in: query
      description: Количество элементов на странице (максимум 100)
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  schemas:

    WorkerWrite:
      type: object
      required: [name, coordinates, salary, startDate, position, person]
      description: Данные работника для создания и обновления (без автогенерируемых полей)
      properties:
        name:
          type: string
          minLength: 1
          description: Имя работника
        coordinates:
          $ref: '#/components/schemas/Coordinates'
          description: Координаты работника
        salary:
          type: integer
          format: int64
          exclusiveMinimum: true
          minimum: 0
          description: Заработная плата (строго больше 0)
        startDate:
          type: string
          format: date
          description: Дата начала работы
        endDate:
          type: string
          format: date
          nullable: true
          description: Дата окончания работы (может быть null)
        position:
          $ref: '#/components/schemas/Position'
          description: Должность работника
        person:
          $ref: '#/components/schemas/Person'
          description: Персональные данные работника
      example:
        name: Ivan Petrov
        coordinates:
          x: 12
          y: -45.7
        salary: 85000
        startDate: '2024-01-15'
        endDate: null
        position: DEVELOPER
        person:
          passportID: AB1234567
          location:
            x: 10.5
            y: 20.25
            z: 300
            name: Saint Petersburg

    Worker:
      allOf:
        - type: object
          required: [id, creationDate]
          properties:
            id:
              type: integer
              format: int32
              minimum: 1
              description: Уникальный идентификатор работника, генерируется автоматически
            creationDate:
              type: string
              format: date-time
              description: Дата создания записи, генерируется автоматически
        - $ref: '#/components/schemas/WorkerWrite'
      example:
        id: 1
        name: Ivan Petrov
        coordinates:
          x: 12
          y: -45.7
        creationDate: '2026-09-07T12:30:00Z'
        salary: 85000
        startDate: '2024-01-15'
        endDate: null
        position: DEVELOPER
        person:
          passportID: AB1234567
          location:
            x: 10.5
            y: 20.25
            z: 300
            name: Saint Petersburg

    Coordinates:
      type: object
      description: Координаты работника
      required: [x, y]
      properties:
        x:
          type: integer
          format: int32
          description: Координата по оси X
        y:
          type: number
          format: double
          description: Координата по оси Y

    Person:
      type: object
      description: Персональные данные работника
      properties:
        passportID:
          type: string
          minLength: 7
          maxLength: 23
          nullable: true
          description: Номер паспорта (уникальный, может быть null)
        location:
          allOf:
            - $ref: '#/components/schemas/Location'
          nullable: true
          description: Местоположение (может быть null)

    Location:
      type: object
      description: Географическая локация
      required: [x, y, z]
      properties:
        x:
          type: number
          format: float
          description: Координата по оси X
        y:
          type: number
          format: double
          description: Координата по оси Y
        z:
          type: integer
          format: int64
          description: Координата по оси Z
        name:
          type: string
          minLength: 1
          nullable: true
          description: Название локации (может быть null, непустое)

    Position:
      type: string
      description: Должность работника
      enum: [DEVELOPER, LEAD_DEVELOPER, BAKER]

    WorkerPage:
      type: object
      description: Страница со списком работников
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          description: Массив объектов Worker на текущей странице
          items:
            $ref: '#/components/schemas/Worker'
        page:
          type: integer
          format: int32
          description: Номер текущей страницы
        size:
          type: integer
          format: int32
          description: Размер страницы
        totalElements:
          type: integer
          format: int64
          description: Общее количество элементов во всей коллекции
        totalPages:
          type: integer
          format: int32
          description: Общее количество страниц

    Error:
      type: object
      description: Общая структура ошибки
      required: [message]
      properties:
        message:
          type: string
          description: Текстовое описание ошибки
        details:
          type: array
          description: Детали ошибки (опционально, присутствует при ошибках валидации)
          items:
            type: object
            properties:
              field:
                type: string
                description: Имя поля, к которому относится проблема
              issue:
                type: string
                description: Описание проблемы