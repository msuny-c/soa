openapi: 3.0.3

info:
  title: HR Service
  description: Сервис индексации заработной платы. Использует API Worker Collection Service.
  version: 1.0.0

servers:
  - url: https://localhost:8443/hr

tags:
  - name: indexation

paths:

  /index/{worker-id}/{coeff}:
    post:
      tags: [indexation]
      summary: Проиндексировать заработную плату указанному сотруднику на заданный коэффициент
      parameters:
        - name: worker-id
          in: path
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
        - $ref: '#/components/parameters/Coeff'
      responses:
        '200':
          description: Зарплата проиндексирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /index/all/{org-id}/{coeff}:
    post:
      tags: [indexation]
      summary: Проиндексировать заработную плату всем сотрудникам указанной организации
      parameters:
        - name: org-id
          in: path
          required: true
          description: Идентификатор организации, значение поля person.location.name
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Coeff'
      responses:
        '200':
          description: Зарплаты проиндексированы
          content:
            application/json:
              schema:
                type: object
                required: [updated_count, results]
                properties:
                  updated_count:
                    type: integer
                    format: int32
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndexationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:

  parameters:

    Coeff:
      name: coeff
      in: path
      required: true
      schema:
        type: number
        format: double
        exclusiveMinimum: true
        minimum: 0

  schemas:

    IndexationResult:
      type: object
      required: [worker_id, old_salary, new_salary]
      properties:
        worker_id:
          type: integer
          format: int32
        old_salary:
          type: integer
          format: int64
        new_salary:
          type: integer
          format: int64

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string

  responses:

    BadRequest:
      description: Некорректные параметры запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Сотрудник или организация не найдены
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UnprocessableEntity:
      description: Недопустимое значение коэффициента или результата индексации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadGateway:
      description: Первый сервис недоступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'